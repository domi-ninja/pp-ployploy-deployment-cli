---
- name: Require Forgejo domain
  ansible.builtin.assert:
    that:
      - forgejo_domain | length > 0
      - forgejo_root_url | length > 0
    fail_msg: "Set forgejo_domain and forgejo_root_url before enabling Forgejo."

- name: Require Forgejo secrets
  ansible.builtin.assert:
    that:
      - forgejo_db_password | length > 0
      - forgejo_secret_key | length > 0
      - forgejo_internal_token | length > 0
      - forgejo_lfs_jwt_secret | length > 0
      - forgejo_oauth2_jwt_secret | length > 0
    fail_msg: "Set Forgejo secrets in an ignored credentials file."
  no_log: true

- name: Create Forgejo directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ forgejo_base_dir }}"
      owner: root
      group: root
      mode: "0750"
    - path: "{{ forgejo_compose_dir }}"
      owner: root
      group: root
      mode: "0750"
    - path: "{{ forgejo_app_dir }}"
      owner: "{{ forgejo_uid }}"
      group: "{{ forgejo_gid }}"
      mode: "0750"
    - path: "{{ forgejo_postgres_dir }}"
      owner: "{{ forgejo_postgres_uid }}"
      group: "{{ forgejo_postgres_gid }}"
      mode: "0700"

- name: Install Forgejo compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ forgejo_compose_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0600"
  notify: restart forgejo
  no_log: true

- name: Install Forgejo proxy route
  ansible.builtin.template:
    src: forgejo.yaml.j2
    dest: "{{ forgejo_proxy_dynamic_dir }}/forgejo.yaml"
    owner: "9999"
    group: root
    mode: "0600"
  when: forgejo_proxy_dynamic_dir | length > 0

- name: Start Forgejo stack
  ansible.builtin.command: "docker compose -f {{ forgejo_compose_dir }}/compose.yml up -d --pull always --remove-orphans"
  changed_when: true
  no_log: true

- name: Wait for Forgejo HTTP endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ forgejo_http_port }}/"
    follow_redirects: none
    status_code:
      - 200
      - 302
      - 303
  register: forgejo_http_check
  retries: 60
  delay: 5
  until: forgejo_http_check.status in [200, 302, 303]

- name: Check whether Forgejo admin exists
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -u
      - "{{ forgejo_uid }}:{{ forgejo_gid }}"
      - forgejo
      - forgejo
      - admin
      - user
      - list
      - --admin
      - --config
      - /data/gitea/conf/app.ini
  register: forgejo_admin_users
  changed_when: false
  when: forgejo_admin_create_enabled | bool

- name: Require Forgejo admin credentials
  ansible.builtin.assert:
    that:
      - forgejo_admin_username | length > 0
      - forgejo_admin_email | length > 0
      - forgejo_admin_password | length > 0
    fail_msg: "Set Forgejo admin credentials in an ignored credentials file."
  when:
    - forgejo_admin_create_enabled | bool
    - forgejo_admin_username not in forgejo_admin_users.stdout
  no_log: true

- name: Create first Forgejo admin
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -u
      - "{{ forgejo_uid }}:{{ forgejo_gid }}"
      - forgejo
      - forgejo
      - admin
      - user
      - create
      - --admin
      - --username
      - "{{ forgejo_admin_username }}"
      - --email
      - "{{ forgejo_admin_email }}"
      - --password
      - "{{ forgejo_admin_password }}"
      - --must-change-password=false
      - --config
      - /data/gitea/conf/app.ini
  when:
    - forgejo_admin_create_enabled | bool
    - forgejo_admin_username not in forgejo_admin_users.stdout
  no_log: true
