---
forgejo_enabled: false
forgejo_base_dir: /data/forgejo
forgejo_app_dir: "{{ forgejo_base_dir }}/app"
forgejo_postgres_dir: "{{ forgejo_base_dir }}/postgres"
forgejo_compose_dir: "{{ forgejo_base_dir }}/compose"
forgejo_proxy_dynamic_dir: /data/coolify/proxy/dynamic
forgejo_proxy_network: coolify
forgejo_uid: "1000"
forgejo_gid: "1000"
forgejo_postgres_uid: "70"
forgejo_postgres_gid: "70"
forgejo_image: codeberg.org/forgejo/forgejo:15
forgejo_postgres_image: postgres:16-alpine
forgejo_http_bind: "127.0.0.1"
forgejo_http_port: "3000"
forgejo_ssh_bind: "0.0.0.0"
forgejo_ssh_port: "2222"
forgejo_domain: ""
forgejo_root_url: ""
forgejo_disable_registration: true
forgejo_require_signin_view: false
forgejo_enable_actions: true
forgejo_db_name: forgejo
forgejo_db_user: forgejo
forgejo_db_password: ""
forgejo_secret_key: ""
forgejo_internal_token: ""
forgejo_lfs_jwt_secret: ""
forgejo_oauth2_jwt_secret: ""
forgejo_admin_create_enabled: false
forgejo_admin_username: ""
forgejo_admin_email: ""
forgejo_admin_password: ""
