---
# Copy this file to a local inventory/group_vars file or override these values
# with --extra-vars. Do not commit real secrets or private keys.

admin_user: deploy
admin_ssh_public_keys:
  - "ssh-ed25519 REPLACE_WITH_YOUR_PUBLIC_KEY comment"

ssh_port: 22
ssh_password_authentication: false
ssh_permit_root_login: "no"

base_timezone: Etc/UTC
system_upgrade: true
swap_file_size_mb: 0

ufw_allowed_tcp_ports:
  - "{{ ssh_port }}"
  - 80
  - 443
ufw_allowed_udp_ports: []

docker_users:
  - "{{ admin_user }}"
docker_enabled: true
docker_data_root_enabled: false
docker_data_root_path: /var/lib/docker

# Optional persistent data volume. Use host_vars for real device IDs.
data_volume_enabled: false
data_volume_src: ""
data_volume_path: /data
data_volume_fstype: ext4
data_volume_opts: "discard,nofail,defaults"
data_volume_previous_mountpoints: []

# Optional Coolify install. Keep host-specific URL and storage settings in
# ignored host_vars files.
coolify_enabled: false
coolify_app_url: ""

# Optional Forgejo server. Keep host-specific domains and secrets in ignored
# host vars files.
forgejo_enabled: false
forgejo_domain: ""
forgejo_root_url: ""
forgejo_ssh_port: "2222"

# Optional Codeberg/Forgejo Actions runner.
forgejo_runner_enabled: false
forgejo_runner_registered: false
forgejo_runner_name: codeberg-prod-1
forgejo_runner_labels:
  - "docker:docker://node:22-bookworm"
  - "ubuntu-24.04:docker://ubuntu:24.04"

# Optional Codeberg-hosted Woodpecker agent.
woodpecker_agent_enabled: false
woodpecker_agent_secret: ""
woodpecker_agent_labels: {}
